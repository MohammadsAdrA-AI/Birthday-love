<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cute Surprise 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Arial", sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    }

    .card {
      width: 90%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.88);
      padding: 40px 25px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(255, 77, 109, 0.35);
      backdrop-filter: blur(10px);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      color: #ff3d6e;
      font-size: 34px;
      margin-bottom: 10px;
    }

    h2 {
      color: #444;
      font-size: 24px;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 14px 24px;
      font-size: 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.25s;
      font-weight: bold;
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff8fab);
      color: white;
      box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
    }

    #yes:hover {
      transform: scale(1.12);
    }

    #no {
      background: #333;
      color: white;
    }

    #message {
      margin-top: 25px;
      font-size: 20px;
      color: #ff3d6e;
      font-weight: bold;
      min-height: 30px;
    }

    .heart {
      position: fixed;
      top: -20px;
      font-size: 24px;
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🎉 Surprise 🎉</h1>
    <h2>Do you love me? 🥺💖</h2>

    <div class="buttons">
      <button id="yes">Yes 😍</button>
      <button id="no">No 😐</button>
    </div>

    <div id="message"></div>
  </div>

  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/10/30/audio_3479f2e8f2.mp3?filename=happy-birthday-to-you-piano-version-13976.mp3" type="audio/mpeg">
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const message = document.getElementById("message");
    const music = document.getElementById("music");

    const messages = [
      "Are you sure? 😢",
      "Think again 🥺",
      "Really? 😭",
      "You are breaking my heart 💔",
      "Last chance 😳",
      "Okay now I am sad 😤",
      "Fine... but I will cry 😭",
      "No is not allowed anymore 😌"
    ];

    let count = 0;

    noBtn.addEventListener("click", () => {
      if (count < messages.length) {
        message.innerText = messages[count];
        count++;
        noBtn.style.transform = `scale(${1 - count * 0.07})`;
        yesBtn.style.transform = `scale(${1 + count * 0.08})`;
      } else {
        noBtn.innerText = "Yes 😍";
        noBtn.style.background = "linear-gradient(135deg, #ff4d6d, #ff8fab)";
        message.innerText = "Hehe, I knew it 😏💖";
      }
    });

    yesBtn.addEventListener("click", () => {
      message.innerText = "Yaaay! I love you too 😍💖";
      music.play();

      confetti({
        particleCount: 180,
        spread: 100,
        origin: { y: 0.6 }
      });

      setInterval(() => {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: {
            x: Math.random(),
            y: Math.random() - 0.2
          }
        });
      }, 1200);
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 3 + Math.random() * 3 + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 400);
  </script>

</body>
</html>
